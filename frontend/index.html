<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Question Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Integration Question Generator</h1>
        <p class="subtitle">Generate integration questions by difficulty</p>

        <div class="control-group">
            <label for="difficulty-select">Select Difficulty:</label>
            <select id="difficulty-select">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <button id="fetch-btn" type="button">Generate Question</button>

        <div id="question-container" class="question-box">
            <p id="question-text">Select difficulty and click generate.</p>
        </div>

        <p id="error-msg" class="error-text" hidden></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
