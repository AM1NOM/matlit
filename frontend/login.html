<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Math Question Generator</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Link to external JS module -->
    <script type="module" src="../database/auth.js" defer></script>
</head>
<body>
    <main class="card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Log in to track your math progress</p>

        <!-- Email/Password Form -->
        <form id="login-form" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <div class="control-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email" style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;" required />
            </div>

            <div class="control-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password" style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;" required />
            </div>

            <button type="submit" style="width: 100%; padding: 12px; cursor: pointer;">Log In</button>
        </form>

        <!-- Divider -->
        <div style="text-align: center; margin: 15px 0; color: #666;">OR</div>

        <!-- Google Login Button -->
        <button id="google-login-btn" type="button" style="width: 100%; padding: 12px; cursor: pointer; background: #fff; border: 1px solid #ccc;">
            Sign in with Google
        </button>

        <p id="login-error" class="error-text" style="color: red; margin-top: 10px; text-align: center;" hidden></p>

        <p style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="color: inherit; text-decoration: underline;">&larr; Back to Generator</a>
        </p>
    </main>
</body>
</html>
